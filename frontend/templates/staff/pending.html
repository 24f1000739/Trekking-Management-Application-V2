{% extends "base.html" %}

{% block title %}Pending Approval{% endblock %}

{% block body %}
<div class="auth-wrapper">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card auth-card text-center">
                    <div class="card-body p-5">
                        <i class="bi bi-hourglass-split display-1 text-warning mb-3"></i>
                        <h3>Account Pending Approval</h3>
                        <p class="text-muted">Your staff registration is awaiting admin approval. You will be able to access the dashboard once approved.</p>
                        <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-primary mt-3">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
